<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 抠图工具 Web 版</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    margin: 0; background: #f5f6fa; color: #333;
  }
  header {
    background: #2f3640; color: #fff; padding: 14px 24px;
    font-size: 18px; font-weight: bold;
  }
  .wrap {
    display: flex; gap: 16px; padding: 16px;
    max-width: 1400px; margin: 0 auto;
  }
  .panel {
    flex: 1; background: #fff; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 12px; display: flex; flex-direction: column;
  }
  .panel h3 { margin: 0 0 8px; font-size: 14px; color: #666; }
  .imgbox {
    flex: 1; min-height: 420px;
    border: 1px dashed #ccc; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    background: repeating-conic-gradient(#e9e9e9 0% 25%, #fff 0% 50%) 50% / 20px 20px;
    overflow: hidden;
  }
  .imgbox img { max-width: 100%; max-height: 560px; display: none; }
  .imgbox .placeholder { color: #aaa; font-size: 14px; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 10px;
    margin-top: 12px; align-items: center;
  }
  button {
    padding: 8px 16px; border: none; border-radius: 6px;
    background: #40739e; color: #fff; cursor: pointer;
    font-size: 14px; transition: .2s;
  }
  button:hover { background: #2f5a80; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  button.primary { background: #44bd32; }
  button.primary:hover { background: #379428; }
  #status {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #2f3640; color: #fff; padding: 8px 16px;
    font-size: 13px;
  }
  input[type=file] { display: none; }
  label.filebtn {
    padding: 8px 16px; border-radius: 6px; background: #40739e;
    color: #fff; cursor: pointer; font-size: 14px;
  }
  label.filebtn:hover { background: #2f5a80; }
</style>
</head>
<body>

<header>AI 抠图工具（Web 版）</header>

<div class="wrap">
  <div class="panel">
    <h3>原图</h3>
    <div class="imgbox" id="leftBox">
      <span class="placeholder">尚未选择图片</span>
      <img id="leftImg">
    </div>
  </div>
  <div class="panel">
    <h3>抠图结果</h3>
    <div class="imgbox" id="rightBox">
      <span class="placeholder">等待抠图</span>
      <img id="rightImg">
    </div>
  </div>
</div>

<div class="controls" style="padding: 0 16px 60px; max-width:1400px; margin:0 auto;">
  <label class="filebtn" for="fileInput">📂 打开图片</label>
  <input type="file" id="fileInput" accept="image/*">
  <button id="btnRemove" class="primary" disabled>✂️ 开始抠图</button>
  <button id="btnSave" disabled>💾 保存结果</button>
  <span id="info" style="font-size:13px;color:#666;"></span>
</div>

<div id="status">就绪</div>

<script>
const fileInput = document.getElementById('fileInput');
const leftImg = document.getElementById('leftImg');
const rightImg = document.getElementById('rightImg');
const leftBox = document.getElementById('leftBox');
const rightBox = document.getElementById('rightBox');
const btnRemove = document.getElementById('btnRemove');
const btnSave = document.getElementById('btnSave');
const statusBar = document.getElementById('status');
const info = document.getElementById('info');

let currentFile = null;
let resultDataUrl = null;

function setStatus(msg) { statusBar.textContent = msg; }

fileInput.addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  currentFile = f;
  resultDataUrl = null;
  rightImg.style.display = 'none';
  rightBox.querySelector('.placeholder')?.style.setProperty('display', 'block');

  const url = URL.createObjectURL(f);
  leftImg.src = url;
  leftImg.style.display = 'block';
  leftBox.querySelector('.placeholder').style.display = 'none';

  btnRemove.disabled = false;
  btnSave.disabled = true;
  info.textContent = `文件：${f.name}  (${(f.size/1024).toFixed(1)} KB)`;
  setStatus('图片已加载，点击"开始抠图"');
});

btnRemove.addEventListener('click', async () => {
  if (!currentFile) return;
  btnRemove.disabled = true;
  setStatus('正在抠图中，请稍候...');
  info.textContent = '';

  const formData = new FormData();
  formData.append('image', currentFile);

  try {
    const res = await fetch('/api/remove', { method: 'POST', body: formData });
    const data = await res.json();
    if (!data.ok) throw new Error(data.msg || '抠图失败');

    resultDataUrl = data.image;
    rightImg.src = resultDataUrl;
    rightImg.style.display = 'block';
    rightBox.querySelector('.placeholder').style.display = 'none';
    btnSave.disabled = false;
    info.textContent = `耗时 ${data.elapsed}s，原尺寸 ${data.size[0]}×${data.size[1]}`;
    setStatus('抠图完成 ✔');
  } catch (err) {
    setStatus('失败：' + err.message);
    alert('抠图失败：' + err.message);
  } finally {
    btnRemove.disabled = false;
  }
});

btnSave.addEventListener('click', () => {
  if (!resultDataUrl) return;
  const a = document.createElement('a');
  a.href = resultDataUrl;
  a.download = '抠图结果.png';
  a.click();
  setStatus('已保存');
});
</script>

</body>
</html>
